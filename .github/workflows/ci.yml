name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: workspace tests
        run: cargo test --workspace
      - name: M0 smoke demo
        run: cargo run -p sparrow-testkit --example m0_pipeline_smoke
      - name: M1 kernel smoke
        run: cargo run -p sparrow-testkit --example m1_kernel_smoke
      - name: M1 SQL/Graph equivalence
        run: cargo run -p sparrow-testkit --example m1_sql_graph_equiv
      - name: M2 MQTT/HTTP closed loop
        run: cargo run -p sparrow-cli --bin m2_mqtt_http_loop
      - name: G1a experiment
        run: cargo run -p arrow-evaluation
