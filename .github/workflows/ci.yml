name: production-gates
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 2 * * 1'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: core-${{ runner.os }}-1.98.0-${{ hashFiles('Cargo.lock') }}
      - name: Static checks and core/independent specifications
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          base="$DIFF_BASE"
          if [[ ! "$base" =~ ^[0-9a-f]{40,64}$ ]] || ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            base=$(git rev-parse --verify 'HEAD~1^{commit}' 2>/dev/null || true)
            echo '::warning::Event diff base unavailable; using first parent if present'
          fi
          if [[ -n "$base" ]]; then git diff --check "$base" HEAD; else echo '::warning::No parent commit; skipping diff whitespace check'; fi
          # Keep legacy formatting debt out of the R10 functional diff. Report
          # it explicitly until a separate formatting-only cleanup is agreed.
          if ! cargo fmt --all -- --check > artifacts/format.log 2>&1; then
            echo '::warning::Legacy formatting debt remains; see format.log (not a blocking gate yet)'
          fi
          for script in scripts/*.sh; do bash -n "$script"; done
          bash scripts/production-freeze-tests.sh artifacts core
      - name: Scheduled deterministic repetitions (not a soak certificate)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          bash scripts/production-freeze-tests.sh artifacts production
          bash scripts/production-repeat.sh artifacts 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-evidence
          path: artifacts/
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: production-${{ runner.os }}-1.98.0-${{ hashFiles('Cargo.lock') }}
      - name: Isolated no-demo tests and package
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash scripts/production-freeze-tests.sh artifacts production
          if ! cargo clippy --locked --release --quiet --no-default-features -p sparrow-server -p sparrow-cli > artifacts/clippy.log 2>&1; then
            tail -n 60 artifacts/clippy.log; exit 1
          fi
          bash scripts/production-build.sh artifacts/package
          (cd artifacts/package && sha256sum -c SHA256SUMS)
          bash scripts/production-smoke.sh artifacts/package artifacts/smoke
          # Keep baseline artifacts out of the candidate's incremental cache.
          baseline=9a925275d362400c398037532903efdb8c4f8a8d
          git worktree add --detach artifacts/r10-source "$baseline"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/artifacts/r10-target" SPARROW_BUILD_COMMIT="$baseline" \
            cargo build --manifest-path artifacts/r10-source/Cargo.toml --locked --release --quiet \
            --no-default-features -p sparrow-server --bin sparrow-server > artifacts/r10-build.log 2>&1
          sha256sum artifacts/r10-target/release/sparrow-server > artifacts/r10-binary.sha256
          bash scripts/production-k1-smoke.sh artifacts/package artifacts/k1-smoke artifacts/r10-target/release/sparrow-server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-evidence
          path: artifacts/
