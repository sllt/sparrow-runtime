name: nats-contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      analysis_smoke_only:
        description: Run only the bounded analysis process recovery cases (no repetitions)
        type: boolean
        default: false
      release_candidate_run:
        description: Optional successful production-gates run; run release checks instead of broker tests
        type: string
        default: ''
      release_baseline_run:
        description: Successful v39-capable baseline production-gates run
        type: string
        default: ''
      release_connectors:
        description: Also build/check one combined optional Connector package
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate_run != '' }}
    uses: ./.github/workflows/release-readiness.yml
    with:
      candidate_run: ${{ inputs.release_candidate_run }}
      baseline_run: ${{ inputs.release_baseline_run }}
      build_connectors: ${{ inputs.release_connectors }}
  connectors:
    if: ${{ !inputs.release_candidate_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        feature: [nats, jetstream]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nats-contracts-${{ runner.os }}-1.98.0-${{ matrix.feature }}-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned isolated-test broker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nats-broker"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/nats-io/nats-server/releases/download/v2.14.6/nats-server-v2.14.6-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/nats-broker.tar.gz"
          printf '61c3d55f69f61ec616b75782250936445f2819e9e5f2ae6159b10a31abd2200c  %s\n' "$RUNNER_TEMP/nats-broker.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nats-broker.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/nats-broker"
          "$RUNNER_TEMP/nats-broker/nats-server" --version
      - name: Feature regression and real-broker contracts
        if: ${{ !inputs.analysis_smoke_only }}
        env:
          FEATURE: ${{ matrix.feature }}
          SPARROW_NATS_SERVER: ${{ runner.temp }}/nats-broker/nats-server
          SPARROW_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/brokers
        run: |
          set -euo pipefail
          mkdir -p artifacts/brokers
          git rev-parse HEAD > artifacts/commit.txt
          if ! cargo test --locked --release --quiet --message-format=json \
            -p sparrow-connectors -p sparrow-control -p sparrow-server \
            --features "sparrow-server/$FEATURE" \
            > artifacts/tests.jsonl 2> artifacts/build.log; then
            tail -n 60 artifacts/build.log
            jq -Rr 'fromjson?|select(.reason=="compiler-message" and .message.level=="error")|.message.rendered' artifacts/tests.jsonl || true
            grep -A 20 -B 3 -E 'FAILED|panicked|test result: FAILED' artifacts/tests.jsonl || true
            exit 1
          fi
          jq -Rn '[inputs|fromjson?|select(.reason=="compiler-artifact" and .profile.test and .executable!=null)|{name:.target.name,exe:.executable}]' \
            artifacts/tests.jsonl > artifacts/test-binaries.json
          connector=$(jq -er '.[]|select(.name=="sparrow_connectors")|.exe' artifacts/test-binaries.json)
          control=$(jq -er '.[]|select(.name=="sparrow_control")|.exe' artifacts/test-binaries.json)
          sha256sum "$connector" "$control" > artifacts/test-binaries.sha256
          # Broker fixtures persist checkpoint evidence outside the default
          # /tmp/sparrow root. Authorize that test directory, not the whole FS.
          export SPARROW_DATA_ROOTS="$SPARROW_TEST_ARTIFACTS:${TMPDIR:-/tmp}/sparrow"
          run_contracts() {
            local binary=$1 filter=$2 label=$3
            "$binary" "$filter" --list > "artifacts/$label.list"
            grep -q ': test$' "artifacts/$label.list"
            if ! timeout 240s "$binary" "$filter" --include-ignored --test-threads=1 \
              > "artifacts/$label.log" 2>&1; then
              tail -n 80 "artifacts/$label.log"
              exit 1
            fi
            tail -n 3 "artifacts/$label.log"
          }
          # This checkpoint regression used to infer HTTP completion from
          # sleeps and race a 100ms success deadline under CI load. Repeat
          # its real progress/late-ACK contract without rebuilding the binary.
          for round in $(seq 1 10); do
            run_contracts "$control" 'review_tests::n4_stale_barrier_ack_not_used_for_next_checkpoint' "late-checkpoint-ack-$round"
          done
          for round in 1 2; do
            run_contracts "$connector" 'nats::' "nats-connector-$round"
            run_contracts "$control" 'nats_tests::' "nats-control-$round"
            if [[ "$FEATURE" == jetstream ]]; then
              run_contracts "$connector" 'jetstream::' "jetstream-connector-$round"
              run_contracts "$control" 'k2_' "jetstream-control-$round"
              if [[ -f crates/sparrow-control/src/jetstream_sink_tests.rs ]]; then
                run_contracts "$control" 'jetstream_sink_tests::' "jetstream-sink-control-$round"
              fi
            fi
          done
      - name: Optional analysis process recovery (one run, not a matrix gate)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.analysis_smoke_only && matrix.feature == 'jetstream' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          if ! cargo build --locked --release --quiet --no-default-features \
            -p sparrow-server --bin sparrow-server --features jetstream \
            > artifacts/analysis-build.log 2>&1; then
            tail -n 80 artifacts/analysis-build.log; exit 1
          fi
          go vet tests/analysis-recovery-process/main.go
          go build -o "$RUNNER_TEMP/analysis-recovery-process" tests/analysis-recovery-process/main.go
          sha256sum target/release/sparrow-server "$RUNNER_TEMP/analysis-recovery-process" \
            "$RUNNER_TEMP/nats-broker/nats-server" > artifacts/analysis-binaries.sha256
          timeout 180s "$RUNNER_TEMP/analysis-recovery-process" \
            --server-bin "$PWD/target/release/sparrow-server" \
            --nats-server "$RUNNER_TEMP/nats-broker/nats-server" \
            --out "$PWD/artifacts/analysis-process" > artifacts/analysis-process.log 2>&1 || {
              tail -n 80 artifacts/analysis-process.log; exit 1;
            }
          tail -n 5 artifacts/analysis-process.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nats-contracts-${{ matrix.feature }}
          path: artifacts/
