name: websocket-contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  websocket:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [standalone, jetstream]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.0 --profile minimal
      - name: Verify independent Protobuf fixtures with pinned protoc
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/protoc"
          curl --fail --location --retry 3 \
            https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip \
            -o "$RUNNER_TEMP/protoc/release.zip"
          printf '%s  %s\n' 121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278 \
            "$RUNNER_TEMP/protoc/release.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/protoc/release.zip" -d "$RUNNER_TEMP/protoc"
          export SPARROW_PROTOC="$RUNNER_TEMP/protoc/bin/protoc"
          bash scripts/protobuf-fixtures.sh --check
          printf 'SPARROW_PROTOC=%s\n' "$SPARROW_PROTOC" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sparrow-services/postgresql-16.15
          key: postgres-tls-${{ runner.os }}-16.15-v1
      - name: Install pinned isolated PostgreSQL test service
        run: |
          set -euo pipefail
          dest="$HOME/.cache/sparrow-services/postgresql-16.15"
          if [[ ! -x "$dest/bin/postgres" ]]; then
            mkdir -p "$RUNNER_TEMP/pg-build"
            curl --fail --location --retry 3 \
              https://ftp.postgresql.org/pub/source/v16.15/postgresql-16.15.tar.bz2 \
              -o "$RUNNER_TEMP/pg-build/source.tar.bz2"
            printf '%s  %s\n' c1575341fa7bd40f5274ea465b34390f4dc64cdd0770af327005caaeb9f6b7ed \
              "$RUNNER_TEMP/pg-build/source.tar.bz2" | sha256sum --check
            tar -xjf "$RUNNER_TEMP/pg-build/source.tar.bz2" -C "$RUNNER_TEMP/pg-build"
            cd "$RUNNER_TEMP/pg-build/postgresql-16.15"
            if ! (./configure --prefix="$dest" --with-openssl --without-readline --without-icu \
              && make -j2 && make install) > "$RUNNER_TEMP/pg-build/build.log" 2>&1; then
              tail -n 80 "$RUNNER_TEMP/pg-build/build.log"
              exit 1
            fi
          fi
          "$dest/bin/postgres" --version
          printf 'SPARROW_POSTGRES_BIN=%s\n' "$dest/bin" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sparrow-services/redis
          key: redis-tls-${{ runner.os }}-${{ matrix.profile }}-6.2.24-7.2.16-v1
      - name: Install pinned isolated Redis test service
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          if [[ "$PROFILE" == standalone ]]; then
            version=6.2.24
            digest=c3f112749c7cb108597713469cc9beed305e91f036fba313ce8dcbad829f5821
          else
            version=7.2.16
            digest=960a8ec15e34ff40e57ff16837b26b33bd81f2da6d24497bb63de532a323a18e
          fi
          dest="$HOME/.cache/sparrow-services/redis/$version"
          if [[ ! -x "$dest/redis-server" ]]; then
            mkdir -p "$dest" "$RUNNER_TEMP/redis-build"
            curl --fail --location --retry 3 "https://download.redis.io/releases/redis-$version.tar.gz" \
              -o "$RUNNER_TEMP/redis-build/source.tar.gz"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/redis-build/source.tar.gz" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/redis-build/source.tar.gz" -C "$RUNNER_TEMP/redis-build"
            if ! make -C "$RUNNER_TEMP/redis-build/redis-$version" -j2 BUILD_TLS=yes MALLOC=libc \
              redis-server > "$RUNNER_TEMP/redis-build/build.log" 2>&1; then
              tail -n 60 "$RUNNER_TEMP/redis-build/build.log"
              exit 1
            fi
            install -m 755 "$RUNNER_TEMP/redis-build/redis-$version/src/redis-server" "$dest/redis-server"
          fi
          "$dest/redis-server" --version
          printf 'SPARROW_REDIS_SERVER=%s\n' "$dest/redis-server" >> "$GITHUB_ENV"
      - name: Install pinned isolated InfluxDB test service
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/influxdb"
          curl --fail --location --retry 3 \
            https://dl.influxdata.com/influxdb/releases/influxdb2-2.9.1_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/influxdb/release.tar.gz"
          printf '%s  %s\n' \
            762e4fc825c4386e0c5138e7c3f91fc778081db2bada1ec47066e786bf55d9ff \
            "$RUNNER_TEMP/influxdb/release.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/influxdb/release.tar.gz" -C "$RUNNER_TEMP/influxdb"
          binary=$(find "$RUNNER_TEMP/influxdb" -type f -name influxd -print -quit)
          test -x "$binary"
          printf 'SPARROW_INFLUXD=%s\n' "$binary" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: websocket-contracts-${{ runner.os }}-1.98.0-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}
      - name: Production feature combinations and network connector contracts
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          features=sparrow-server/websocket,sparrow-server/postgres
          if [[ "$PROFILE" == jetstream ]]; then
            features+=,sparrow-server/jetstream
          fi
          if ! cargo test --locked --release --quiet --no-default-features --message-format=json \
            -p sparrow-connectors -p sparrow-control -p sparrow-server -p sparrow-formats \
            --features "$features" \
            > artifacts/tests.jsonl 2> artifacts/build.log; then
            tail -n 60 artifacts/build.log
            jq -Rr 'fromjson?|select(.reason=="compiler-message" and .message.level=="error")|.message.rendered' artifacts/tests.jsonl || true
            grep -A 20 -B 3 -E 'FAILED|panicked|test result: FAILED' artifacts/tests.jsonl || true
            exit 1
          fi
          jq -Rn '[inputs|fromjson?|select(.reason=="compiler-artifact" and .profile.test and .executable!=null)|{name:.target.name,exe:.executable}]' \
            artifacts/tests.jsonl > artifacts/test-binaries.json
          connector=$(jq -er '.[]|select(.name=="sparrow_connectors")|.exe' artifacts/test-binaries.json)
          control=$(jq -er '.[]|select(.name=="sparrow_control")|.exe' artifacts/test-binaries.json)
          formats=$(jq -er '.[]|select(.name=="sparrow_formats")|.exe' artifacts/test-binaries.json)
          allocation=$(jq -er '.[]|select(.name=="protobuf_alloc")|.exe' artifacts/test-binaries.json)
          sha256sum "$connector" "$control" "$formats" "$allocation" > artifacts/test-binaries.sha256
          # Repeat the exact compiled binaries: no extra build and no external
          # broker. Fixtures bind ephemeral loopback ports and use a test CA.
          run_contracts() {
            local binary=$1 filter=$2 label=$3
            "$binary" "$filter" --list > "artifacts/$label.list"
            grep -q ': test$' "artifacts/$label.list"
            if ! timeout 240s "$binary" "$filter" --include-ignored --test-threads=1 \
              > "artifacts/$label.log" 2>&1; then
              tail -n 80 "artifacts/$label.log"
              exit 1
            fi
            tail -n 3 "artifacts/$label.log"
          }
          for round in 1 2; do
            run_contracts "$formats" 'protobuf::' "protobuf-formats-$round"
            run_contracts "$allocation" '' "protobuf-allocation-$round"
            run_contracts "$control" 'protobuf_tests::' "protobuf-control-$round"
            run_contracts "$connector" 'websocket::' "websocket-connector-$round"
            run_contracts "$control" 'websocket_tests::' "websocket-control-$round"
            run_contracts "$connector" 'tcp::' "tcp-connector-$round"
            run_contracts "$control" 'tcp_tests::' "tcp-control-$round"
            run_contracts "$connector" 'influxdb::' "influxdb-connector-$round"
            run_contracts "$control" 'influxdb_tests::' "influxdb-control-$round"
            run_contracts "$connector" 'redis::' "redis-connector-$round"
            run_contracts "$control" 'redis_tests::' "redis-control-$round"
            run_contracts "$connector" 'postgres::' "postgres-connector-$round"
            run_contracts "$control" 'postgres_tests::' "postgres-control-$round"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: websocket-contracts-${{ matrix.profile }}
          path: artifacts/
