[package]
name = "sparrow-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sparrow in-process kernel: ExecutionChain, bounded mailboxes, job supervisor"

[dependencies]
sparrow-model.workspace = true
sparrow-expr.workspace = true
sparrow-plan.workspace = true
sparrow-io = { workspace = true, features = ["observation"] }
tokio.workspace = true
tokio-util.workspace = true
tracing = { version = "0.1.44", default-features = false }
serde = { version = "1", features = ["derive"] }
# No Axum, SQLite, MQTT, or SQL parser.

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json = "1"
