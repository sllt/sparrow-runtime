[package]
name = "sparrow-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authenticated V0.1 management API (Axum). Depends on control; not a sparrow-runtime dependency."

[features]
default = ["demo-io"]
demo-io = ["sparrow-control/demo-io"]

[dependencies]
sparrow-model = { path = "../sparrow-model" }
sparrow-plan = { path = "../sparrow-plan" }
sparrow-control = { path = "../sparrow-control", default-features = false }
sparrow-connectors = { path = "../sparrow-connectors", default-features = false }
sparrow-runtime = { path = "../sparrow-runtime" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", features = ["limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
