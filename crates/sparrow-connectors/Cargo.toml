[package]
name = "sparrow-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MQTT source, HTTP/Log sinks, secrets, and target policy (outside sparrow-runtime)"

[features]
default = ["demo-io"]
demo-io = []
# NATS Core (non-JetStream) live Source/Sink. JetStream reuses its client
# setup, so `jetstream` implies `nats`.
nats = ["dep:async-nats", "dep:futures-util"]
jetstream = ["nats", "dep:ring", "dep:bytes"]
# WebSocket client Source/Sink (ws:// and wss:// over the crate's rustls).
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]
# Kafka consumer-group Source / producer Sink via librdkafka (rdkafka-sys
# builds librdkafka from source: needs a C/C++ toolchain, make and perl).
kafka = ["dep:rdkafka", "dep:futures-util", "dep:ring"]
# PostgreSQL query Source, INSERT/UPSERT Sink and Lookup provider
# (tokio-postgres over the crate's rustls; no libpq, no CDC).
postgres = ["dep:tokio-postgres", "dep:bytes", "dep:futures-util", "dep:serde"]

[dependencies]
sparrow-model = { path = "../sparrow-model" }
sparrow-io = { path = "../sparrow-io", features = ["observation"] }
sparrow-formats = { path = "../sparrow-formats" }
tokio = { workspace = true, features = ["net", "io-util", "sync", "macros", "rt", "time"] }
tokio-util = { workspace = true }
serde_json = "1"
url = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1.0.9"
socket2 = { version = "0.6.5", features = ["all"] }
async-nats = { version = "=0.50.0", optional = true, default-features = false, features = ["ring", "jetstream", "kv", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std", "async-await"] }
ring = { version = "0.17", optional = true }
bytes = { version = "1", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio-tungstenite = { version = "=0.30.0", optional = true, default-features = false, features = ["handshake"] }
rdkafka = { version = "=0.39.0", optional = true, default-features = false, features = ["tokio", "libz-static"] }
tokio-postgres = { version = "=0.7.18", optional = true, default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
sparrow-expr = { path = "../sparrow-expr" }
sparrow-plan = { path = "../sparrow-plan" }
sparrow-runtime = { path = "../sparrow-runtime" }
sparrow-testkit = { path = "../sparrow-testkit", features = ["jetstream"] }
