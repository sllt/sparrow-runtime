[package]
name = "sparrow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thin composition root: wires connectors to sparrow-runtime without adding I/O deps to the kernel"

[dependencies]
sparrow-model = { path = "../sparrow-model" }
sparrow-expr = { path = "../sparrow-expr" }
sparrow-plan = { path = "../sparrow-plan" }
sparrow-runtime = { path = "../sparrow-runtime" }
sparrow-formats = { path = "../sparrow-formats" }
sparrow-connectors = { path = "../sparrow-connectors" }
sparrow-testkit = { path = "../sparrow-testkit" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = { workspace = true }

[[bin]]
name = "m2_mqtt_http_loop"
path = "src/bin/m2_mqtt_http_loop.rs"

[[bin]]
name = "v02_pt_tumble_avg"
path = "src/bin/v02_pt_tumble_avg.rs"

[[bin]]
name = "v02_count_window"
path = "src/bin/v02_count_window.rs"

[[bin]]
name = "v02_bounded_dedup"
path = "src/bin/v02_bounded_dedup.rs"

[[bin]]
name = "v02_static_table"
path = "src/bin/v02_static_table.rs"

[[bin]]
name = "v02_http_mqtt_loop"
path = "src/bin/v02_http_mqtt_loop.rs"

[[bin]]
name = "v03_et_tumble_avg"
path = "src/bin/v03_et_tumble_avg.rs"

[[bin]]
name = "v03_hop_overlap"
path = "src/bin/v03_hop_overlap.rs"

[[bin]]
name = "v03_idle_active"
path = "src/bin/v03_idle_active.rs"

[[bin]]
name = "v03_versioned_lookup"
path = "src/bin/v03_versioned_lookup.rs"
