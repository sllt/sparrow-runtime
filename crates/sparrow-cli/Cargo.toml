[package]
name = "sparrow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thin composition root: wires connectors to sparrow-runtime without adding I/O deps to the kernel"

[features]
default = ["demo-io", "examples"]
demo-io = ["examples", "sparrow-connectors/demo-io"]
examples = ["dep:sparrow-model", "dep:sparrow-expr", "dep:sparrow-plan", "dep:sparrow-io", "dep:sparrow-runtime", "dep:sparrow-formats", "dep:sparrow-connectors", "dep:sparrow-testkit", "dep:tokio-util"]

[dependencies]
sparrow-model = { path = "../sparrow-model", optional = true }
sparrow-expr = { path = "../sparrow-expr", optional = true }
sparrow-plan = { path = "../sparrow-plan", optional = true }
sparrow-io = { path = "../sparrow-io", optional = true }
sparrow-runtime = { path = "../sparrow-runtime", optional = true }
sparrow-formats = { path = "../sparrow-formats", optional = true }
sparrow-connectors = { path = "../sparrow-connectors", default-features = false, optional = true }
sparrow-testkit = { path = "../sparrow-testkit", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = { workspace = true, optional = true }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[[bin]]
name = "m2_mqtt_http_loop"
path = "src/bin/m2_mqtt_http_loop.rs"
required-features = ["demo-io"]

[[bin]]
name = "v02_pt_tumble_avg"
path = "src/bin/v02_pt_tumble_avg.rs"
