[package]
name = "sparrow-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite catalog, desired/actual supervisor, and pipeline validation (outside sparrow-runtime)"

[features]
default = ["demo-io"]
demo-io = ["sparrow-connectors/demo-io"]
nats = ["sparrow-connectors/nats"]
jetstream = ["nats", "sparrow-connectors/jetstream"]
websocket = ["sparrow-connectors/websocket"]
process-fault-pause = ["sparrow-runtime/process-fault-pause"]

[dependencies]
sparrow-model = { path = "../sparrow-model" }
sparrow-expr = { path = "../sparrow-expr" }
sparrow-plan = { path = "../sparrow-plan" }
sparrow-sql = { path = "../sparrow-sql" }
sparrow-runtime = { path = "../sparrow-runtime" }
sparrow-connectors = { path = "../sparrow-connectors", default-features = false }
sparrow-formats = { path = "../sparrow-formats" }
sparrow-io = { path = "../sparrow-io" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tokio-util = { workspace = true }
ring = "0.17"
base64 = "0.22"
tracing = { version = "0.1.44", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
sparrow-testkit = { path = "../sparrow-testkit", features = ["jetstream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
