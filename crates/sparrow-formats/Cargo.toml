[package]
name = "sparrow-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sparrow codecs: bounded JSON decode/encode and schema validation"

[dependencies]
sparrow-model.workspace = true
serde = { version = "1", default-features = false, features = ["std", "derive"] }
# float_roundtrip: decode JSON floats correctly rounded (the default parser
# is best-effort and can be 1 ulp off, e.g. "10.209999999999999" -> 10.21).
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
# RFC 4180 tokenizer/unescaper (no default features to opt out of).
csv = "=1.4.0"
